name: Publish Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "curriculum-redirects.json"
      - "plugins/**"
      - "src/components/**"
      - "src/pages/index.tsx"
      - "src/theme/**"
      - "src/pages/versions.tsx"
      - "versioned_docs/**"
      - "versioned_sidebars/**"
      - "versions.json"
      - "curriculum-versions.json"
      - "static/curriculum-versions/**"
      - "docusaurus.config.ts"
      - "sidebars.ts"
      - "scripts/check-curriculum.mjs"
      - "package.json"
      - "package-lock.json"

jobs:
  deploy:
    name: Publish Docs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check curriculum publication
        run: npm run curriculum:check
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
