name: Check Curriculum

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "curriculum-redirects.json"
      - "plugins/**"
      - "src/components/**"
      - "src/pages/index.tsx"
      - "docs/**"
      - "versioned_docs/**"
      - "versioned_sidebars/**"
      - "versions.json"
      - "curriculum-versions.json"
      - "src/theme/**"
      - "src/pages/versions.tsx"
      - "docusaurus.config.ts"
      - "sidebars.ts"
      - "scripts/check-curriculum.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-curriculum.yml"
      - ".github/workflows/publish-docs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify Current publication and legacy redirects
        run: npm run curriculum:check
