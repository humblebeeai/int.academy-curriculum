name: Curriculum Issue
description: Report problems or improvements for specific curriculum modules, tracks, or content
title: "[Curriculum]: "
labels: ["curriculum", "triage"]
assignees:
  - aliyuldashev
body:
  - type: markdown
    attributes:
      value: |
        Report issues specific to curriculum content, modules, or learning paths.

        For general bugs, please use the [Bug Report](./bug_report.yml) template instead.

  - type: dropdown
    id: curriculum-area
    attributes:
      label: Curriculum Area
      description: Which curriculum area is this issue about?
      options:
        - Engineering Fundamentals
        - Soft Landing - Core Systems
        - Computer Vision Specialization
        - Data Science Specialization
        - Generative AI Specialization
        - NLP Specialization
        - Software Engineering Specialization
        - Documentation/Resources
        - Website/Content
        - Other (specify in description)
      default: 0
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What kind of issue is this?
      options:
        - Content Error/Inaccuracy
        - Missing Information
        - Outdated Content/Link
        - Broken Link/Resource
        - Code Example Issue
        - Documentation Problem
        - Learning Path Issue
        - Content Improvement
        - New Module Proposal
        - Configuration Problem
    validations:
      required: true

  - type: textarea
    id: issue-description
    attributes:
      label: Issue Description
      description: |
        Describe the issue in detail. Include:
        - What you were trying to learn or do
        - What you found vs what you expected
        - How this affects learners
      placeholder: |
        The probability statistics module references an outdated library version
        that's no longer maintained, making the examples non-functional for current
        Python environments.
    validations:
      required: true

  - type: textarea
    id: reproduction-data
    attributes:
      label: Reproduction/Location Data
      description: |
        Provide specific location, steps, or context that demonstrate this issue.
        Include file paths, section names, or learning progression details.
      placeholder: |
        Location: docs/engineering-fundamentals/probability-statistics.mdx
        Section: "Bayesian Inference Examples"
        Steps to reproduce:
        1. Follow the installation instructions
        2. Run the provided code example
        3. Error occurs due to deprecated library API
      render: markdown
    validations:
      required: false

  - type: input
    id: curriculum-version
    attributes:
      label: Curriculum Version/Commit
      description: What version of the curriculum are you referencing?
      placeholder: "v1.2.0 or commit hash: abc123def"
    validations:
      required: false

  - type: textarea
    id: environment-details
    attributes:
      label: Environment Details
      description: |
        Provide details about your learning environment
      placeholder: |
        - OS: Windows 11
        - Python Version: 3.11
        - Browser: Chrome 120.0
        - Following along with: Local setup/Docker/Online
        - Prior experience level: Beginner/Intermediate/Advanced
      render: text
    validations:
      required: false

  - type: textarea
    id: logs-output
    attributes:
      label: Logs, Errors, or Output
      description: |
        Include relevant error messages, code output, or screenshots.
        Remove any sensitive information.
      placeholder: |
        ```
        ImportError: No module named 'deprecated_library'
        ```
        or paste console output here...
      render: shell
    validations:
      required: false

  - type: dropdown
    id: impact-level
    attributes:
      label: Impact Level
      description: How severely does this affect learners?
      options:
        - Critical (blocks learning progression)
        - High (significant confusion or wasted time)
        - Medium (affects some learners)
        - Low (minor inconvenience)
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: |
        If you have ideas for fixing this issue, please describe them.
        Include suggested content updates, new resources, or structural changes.
      placeholder: |
        Suggested fix:
        1. Update library to current maintained version (e.g., library-v2)
        2. Provide migration guide for existing learners
        3. Add note about version compatibility
        4. Update all related code examples
    validations:
      required: false

  - type: checkboxes
    id: testing-checklist
    attributes:
      label: Testing Checklist
      description: Have you verified these aspects?
      options:
        - label: I followed documentation and setup instructions in docs.theredteam.io
        - label: I tested with multiple browsers/environments
        - label: I verified this isn't a configuration issue
        - label: I checked the challenge documentation
        - label: I can reproduce this consistently

  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: |
        Any other context, related issues, or helpful information?
        Screenshots, performance metrics, or research links are welcome.
    validations:
      required: false